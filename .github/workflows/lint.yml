name: "Lint & Validate"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          echo "Scanning shell scripts..."
          sh_files=$(git ls-files '*.sh')
          if [ -n "$sh_files" ]; then
            shellcheck --severity=warning $sh_files
          else
            echo "No shell scripts found."
          fi

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          yamllint -c .yamllint.yml .

  kubeconform:
    name: Kubeconform (K8s Schema)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Kubeconform
        uses: bmuschko/setup-kubeconform@v1
        with:
          kubeconform-version: 'v0.6.7'

      - name: Validate Kubernetes Manifests
        run: |
          echo "Validating Kubernetes manifests against schemas..."
          kubeconform \
            -summary \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            gitops/00-root-app \
            gitops/01-system \
            gitops/02-apps

