apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: versus-incident-secrets
  namespace: private-assistant
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: versus-incident-secrets
    creationPolicy: Owner
  data:
    - secretKey: redis-password
      remoteRef:
        key: redis
        property: redis-password
    - secretKey: gateway-secret
      remoteRef:
        key: versus-incident
        property: gateway-secret
    - secretKey: ai-api-key
      remoteRef:
        key: versus-incident
        property: ai-api-key
