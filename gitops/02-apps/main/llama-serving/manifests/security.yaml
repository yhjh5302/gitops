apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: llama-serving-security
  namespace: private-assistant
spec:
  endpointSelector:
    matchLabels:
      app: llama-serving
  ingress:
    # 1. Allow Kubelet health check on HTTP port 8000
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # 2. Allow Istio ztunnel HBONE tunneling
    - toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
            - port: "15021"
              protocol: TCP
    # 3. Allow HTTP traffic from private-assistant, Ingress Gateway, OAuth2 proxy, and VictoriaMetrics
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": private-assistant
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": istio-system
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": oauth2-proxy
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": victoria-metrics
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: llama-serving-security-policy
  namespace: private-assistant
spec:
  selector:
    matchLabels:
      app: llama-serving
  action: ALLOW
  rules:
    # Rule A: Allow Kubelet health checks
    - to:
        - operation:
            ports: ["8000"]
    # Rule B: Allow access from Versus Incident, Service Ingress Gateway, OAuth2-proxy, and VictoriaMetrics
    - from:
        - source:
            principals:
              - "cluster.local/ns/private-assistant/sa/versus-incident"
              - "cluster.local/ns/private-assistant/sa/private-assistant"
              - "cluster.local/ns/istio-system/sa/service-gateway-istio"
              - "cluster.local/ns/oauth2-proxy/sa/oauth2-proxy"
              - "cluster.local/ns/victoria-metrics/sa/vmagent-victoria-metrics"
      to:
        - operation:
            ports: ["8000"]

