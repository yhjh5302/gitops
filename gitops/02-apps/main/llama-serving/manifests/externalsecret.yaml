apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llama-serving-secrets
  namespace: private-assistant
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: llama-serving-secrets
    creationPolicy: Owner
  data:
    - secretKey: huggingface-token
      remoteRef:
        key: private-assistant
        property: huggingface-token

