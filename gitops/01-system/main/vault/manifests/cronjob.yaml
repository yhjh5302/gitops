apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auto-unsealer
  namespace: vault
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: vault-auto-unsealer-security
  namespace: vault
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": vault
            "app": vault-auto-unsealer
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: vault-auto-unsealer-security-policy
  namespace: vault
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  action: ALLOW
  rules:
    - from:
      - source:
          principals:
            - "cluster.local/ns/vault/sa/vault-auto-unsealer"
      to:
      - operation:
          ports: ["8200"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-auto-unsealer
  namespace: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-auto-unsealer
  template:
    metadata:
      labels:
        app: vault-auto-unsealer
    spec:
      serviceAccountName: vault-auto-unsealer
      containers:
      - name: unsealer
        image: curlimages/curl:latest
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        env:
        - name: UNSEAL_KEY
          valueFrom:
            secretKeyRef:
              name: vault-unseal-key
              key: key
        command:
        - /bin/sh
        - -c
        - |
          VAULT_ADDR="http://vault-0.vault-internal:8200"
          echo "Starting continuous Vault auto-unseal daemon..."
          while true; do
            SEAL_STATUS=$(curl -s --connect-timeout 2 --max-time 3 $VAULT_ADDR/v1/sys/seal-status 2>/dev/null || true)
            if echo "$SEAL_STATUS" | grep -q '"sealed":true'; then
              echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Vault is sealed! Unsealing now..."
              UNSEAL_RESPONSE=$(curl -s --connect-timeout 2 --max-time 5 -X PUT -d "{\"key\":\"$UNSEAL_KEY\"}" $VAULT_ADDR/v1/sys/unseal 2>/dev/null || true)
              echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Unseal response: $UNSEAL_RESPONSE"
            fi
            sleep 5
          done
