apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auto-unsealer
  namespace: vault
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: vault-auto-unsealer-security
  namespace: vault
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": vault
            "app": vault-auto-unsealer
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: vault-auto-unsealer-security-policy
  namespace: vault
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  action: ALLOW
  rules:
    - from:
      - source:
          principals:
            - "cluster.local/ns/vault/sa/vault-auto-unsealer"
      to:
      - operation:
          ports: ["8200"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-auto-unsealer
  namespace: vault
spec:
  schedule: "*/15 * * * *" # 15분마다 실행
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: vault-auto-unsealer
        spec:
          serviceAccountName: vault-auto-unsealer
          containers:
          - name: unsealer
            image: curlimages/curl:8.4.0
            env:
            - name: UNSEAL_KEY
              valueFrom:
                secretKeyRef:
                  name: vault-unseal-key
                  key: key
            command:
            - /bin/sh
            - -c
            - |
              VAULT_ADDR="http://vault-0.vault-internal:8200"
              
              echo "Checking Vault seal status at $VAULT_ADDR..."
              STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" $VAULT_ADDR/v1/sys/seal-status)
              
              if [ "$STATUS_CODE" -ne 200 ] && [ "$STATUS_CODE" -ne 429 ]; then
                echo "Error: Vault API returned HTTP $STATUS_CODE. Vault might be offline."
                exit 1
              fi
              
              SEAL_STATUS=$(curl -s $VAULT_ADDR/v1/sys/seal-status)
              SEALED=$(echo "$SEAL_STATUS" | grep -o '"sealed":true')
              
              if [ ! -z "$SEALED" ]; then
                echo "Vault is sealed. Attempting to unseal..."
                UNSEAL_RESPONSE=$(curl -s -X PUT -d "{\"key\":\"$UNSEAL_KEY\"}" $VAULT_ADDR/v1/sys/unseal)
                echo "Response: $UNSEAL_RESPONSE"
                
                # Check status again to verify unseal was successful
                NEW_STATUS=$(curl -s $VAULT_ADDR/v1/sys/seal-status)
                IS_SEALED=$(echo "$NEW_STATUS" | grep -o '"sealed":true')
                if [ -z "$IS_SEALED" ]; then
                  echo "Successfully unsealed Vault!"
                else
                  echo "Failed to unseal Vault."
                  exit 1
                fi
              else
                echo "Vault is already unsealed."
              fi
          restartPolicy: OnFailure
